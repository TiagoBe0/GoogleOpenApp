<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PsicoLink · Mi Panel</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --navy:#2D4270; --navy-dk:#1F3060; --navy-lt:#EEF2FA;
  --steel:#8AACC8; --steel-lt:#D8EAF7;
  --sage:#7FA98A;  --sage-lt:#D0E8D8;
  --bg:#F4F6FA; --surface:#fff;
  --text:#1C2940; --muted:#8A96A8; --border:#E2E8F0;
  --danger:#C0392B; --danger-lt:#FDF0EE;
  --warn:#C07A20; --warn-lt:#FEF4E6;
  --sidebar-w:240px;
}
html,body{height:100%;font-family:'DM Sans',sans-serif;color:var(--text);background:var(--bg);}
a{color:inherit;text-decoration:none;}
button{font-family:'DM Sans',sans-serif;cursor:pointer;}

/* ── Layout ── */
.shell{display:flex;height:100vh;overflow:hidden;}

/* ── Sidebar ── */
.sidebar{
  width:var(--sidebar-w);flex-shrink:0;
  background:var(--navy);
  display:flex;flex-direction:column;
  overflow:hidden;
}
.sb-logo{
  padding:22px 20px 18px;
  display:flex;align-items:center;gap:10px;
  border-bottom:1px solid rgba(255,255,255,.1);
}
.sb-logo-mark{
  width:28px;height:28px;display:grid;
  grid-template-columns:1fr 1fr;gap:2px;flex-shrink:0;
}
.sb-logo-mark span{border-radius:3px;}
.sb-logo-mark span:nth-child(1){background:#fff;}
.sb-logo-mark span:nth-child(2){background:var(--steel);}
.sb-logo-mark span:nth-child(3){background:var(--sage);}
.sb-logo-mark span:nth-child(4){background:var(--steel-lt);}
.sb-logo-text{font-family:'DM Serif Display',serif;font-size:18px;color:#fff;}

.sb-section{padding:20px 12px 8px;font-size:10px;font-weight:600;letter-spacing:.7px;text-transform:uppercase;color:rgba(255,255,255,.35);}

.sb-nav{flex:1;overflow-y:auto;padding:0 12px;}
.sb-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-radius:10px;
  font-size:13.5px;font-weight:500;color:rgba(255,255,255,.65);
  cursor:pointer;transition:all .15s;margin-bottom:2px;
  border:none;background:none;width:100%;text-align:left;
}
.sb-item:hover{background:rgba(255,255,255,.08);color:#fff;}
.sb-item.active{background:rgba(255,255,255,.15);color:#fff;}
.sb-item svg{flex-shrink:0;opacity:.75;}
.sb-item.active svg{opacity:1;}
.sb-badge{
  margin-left:auto;background:var(--sage);color:#fff;
  font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;
}

.sb-bottom{padding:16px 12px;border-top:1px solid rgba(255,255,255,.1);}
.sb-user{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-radius:10px;
  cursor:pointer;transition:background .15s;
}
.sb-user:hover{background:rgba(255,255,255,.08);}
.sb-avatar{
  width:34px;height:34px;border-radius:50%;
  background:var(--steel-lt);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:13px;color:var(--navy);
}
.sb-user-name{font-size:13px;font-weight:600;color:#fff;}
.sb-user-role{font-size:11px;color:rgba(255,255,255,.45);}

/* ── Main area ── */
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column;}

.topbar{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:0 32px;height:60px;
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;position:sticky;top:0;z-index:50;
}
.topbar-title{font-size:15px;font-weight:600;color:var(--navy);}
.topbar-actions{display:flex;align-items:center;gap:10px;}

.btn{
  padding:9px 20px;border-radius:9px;border:none;
  font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;
  cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:7px;
}
.btn-primary{background:var(--navy);color:#fff;}
.btn-primary:hover{background:var(--navy-dk);box-shadow:0 3px 12px rgba(45,66,112,.25);}
.btn-ghost{background:transparent;color:var(--muted);border:1.5px solid var(--border);}
.btn-ghost:hover{border-color:var(--steel);color:var(--navy);}
.btn-sage{background:var(--sage);color:#fff;}
.btn-sage:hover{background:#6A9476;}
.btn-danger-soft{background:var(--danger-lt);color:var(--danger);border:none;}
.btn-danger-soft:hover{background:#FAD9D5;}
.btn-sm{padding:7px 14px;font-size:12px;}

.content{padding:28px 32px 48px;flex:1;}

/* ── Section headers ── */
.sec-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.sec-title{font-family:'DM Serif Display',serif;font-size:20px;color:var(--navy);}
.sec-link{font-size:12px;color:var(--steel);font-weight:600;cursor:pointer;}
.sec-link:hover{color:var(--navy);}

/* ── Next appointment hero ── */
.next-hero{
  background:linear-gradient(135deg, var(--navy) 0%, #3A5494 100%);
  border-radius:18px;padding:28px 32px;
  display:flex;align-items:center;gap:24px;
  margin-bottom:28px;position:relative;overflow:hidden;
}
.next-hero::before{
  content:'';position:absolute;right:-40px;top:-40px;
  width:200px;height:200px;border-radius:50%;
  background:rgba(255,255,255,.05);
}
.next-hero::after{
  content:'';position:absolute;right:60px;bottom:-60px;
  width:150px;height:150px;border-radius:50%;
  background:rgba(138,172,200,.12);
}
.hero-icon{
  width:56px;height:56px;border-radius:14px;
  background:rgba(255,255,255,.15);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;font-size:22px;z-index:1;
}
.hero-body{flex:1;z-index:1;}
.hero-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:rgba(255,255,255,.55);margin-bottom:4px;}
.hero-date{font-family:'DM Serif Display',serif;font-size:24px;color:#fff;margin-bottom:4px;}
.hero-meta{font-size:13px;color:rgba(255,255,255,.7);display:flex;align-items:center;gap:12px;}
.hero-dot{width:5px;height:5px;border-radius:50%;background:var(--sage);}
.hero-actions{display:flex;gap:10px;flex-shrink:0;z-index:1;}
.btn-white{background:#fff;color:var(--navy);border:none;padding:10px 20px;border-radius:9px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px;}
.btn-white:hover{background:rgba(255,255,255,.9);transform:translateY(-1px);}
.btn-outline-white{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.35);padding:9px 20px;border-radius:9px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;}
.btn-outline-white:hover{background:rgba(255,255,255,.1);}

/* ── Grid ── */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:28px;}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:28px;}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px;}

/* ── Stat cards ── */
.stat-card{
  background:var(--surface);border-radius:14px;border:1px solid var(--border);
  padding:20px;display:flex;flex-direction:column;gap:10px;
}
.stat-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;}
.stat-val{font-family:'DM Serif Display',serif;font-size:28px;color:var(--navy);}
.stat-label{font-size:12px;color:var(--muted);}
.stat-delta{font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:3px;}
.delta-pos{color:var(--sage);}
.delta-neg{color:var(--danger);}

/* ── Upcoming list ── */
.card{background:var(--surface);border-radius:14px;border:1px solid var(--border);overflow:hidden;}
.card-inner{padding:20px 22px;}

.appt-item{
  display:flex;align-items:center;gap:16px;
  padding:14px 0;border-bottom:1px solid var(--border);
}
.appt-item:last-child{border-bottom:none;padding-bottom:0;}
.appt-item:first-child{padding-top:0;}

.appt-date-block{
  flex-shrink:0;width:50px;height:54px;
  border-radius:10px;background:var(--navy-lt);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.appt-day-num{font-family:'DM Serif Display',serif;font-size:22px;color:var(--navy);line-height:1;}
.appt-day-name{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);}
.appt-body{flex:1;}
.appt-time{font-size:13.5px;font-weight:600;color:var(--text);}
.appt-psico{font-size:12px;color:var(--muted);margin-top:2px;}
.appt-tags{display:flex;gap:5px;margin-top:5px;}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:20px;}
.tag-online{background:var(--sage-lt);color:var(--sage);}
.tag-presencial{background:var(--steel-lt);color:var(--steel);}
.tag-paid{background:#E8F5E9;color:#388E3C;}
.tag-pending{background:var(--warn-lt);color:var(--warn);}
.tag-cancelled{background:var(--danger-lt);color:var(--danger);}
.appt-actions{display:flex;gap:7px;flex-shrink:0;}

/* ── History table ── */
.hist-table{width:100%;border-collapse:collapse;}
.hist-table th{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);padding:0 16px 12px;text-align:left;}
.hist-table td{padding:13px 16px;font-size:13px;border-top:1px solid var(--border);vertical-align:middle;}
.hist-table tr:hover td{background:var(--bg);}
.hist-date{font-weight:600;color:var(--text);}
.hist-psico{color:var(--muted);}
.rating{display:flex;gap:2px;}
.star{font-size:12px;}
.star.on{color:#F5A623;}
.star.off{color:var(--border);}

/* ── Profile card ── */
.profile-card{background:var(--surface);border-radius:14px;border:1px solid var(--border);padding:24px;}
.profile-avatar{
  width:72px;height:72px;border-radius:50%;
  background:linear-gradient(135deg,var(--steel-lt),var(--sage-lt));
  display:flex;align-items:center;justify-content:center;
  font-family:'DM Serif Display',serif;font-size:28px;color:var(--navy);
  margin-bottom:14px;
}
.profile-name{font-family:'DM Serif Display',serif;font-size:20px;color:var(--navy);margin-bottom:2px;}
.profile-email{font-size:12px;color:var(--muted);margin-bottom:16px;}
.profile-field{display:flex;flex-direction:column;gap:2px;margin-bottom:14px;}
.field-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);}
.field-val{font-size:13.5px;color:var(--text);}
.field-edit{
  background:none;border:none;color:var(--steel);
  font-size:12px;font-weight:600;cursor:pointer;padding:0;
  margin-top:3px;text-align:left;
}
.field-edit:hover{color:var(--navy);}

/* ── Payment card ── */
.pay-item{
  display:flex;align-items:center;gap:14px;
  padding:13px 0;border-bottom:1px solid var(--border);
}
.pay-item:last-child{border-bottom:none;padding-bottom:0;}
.pay-item:first-child{padding-top:0;}
.pay-icon{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.pay-body{flex:1;}
.pay-desc{font-size:13px;font-weight:600;color:var(--text);}
.pay-date{font-size:11.5px;color:var(--muted);margin-top:1px;}
.pay-amount{font-family:'DM Serif Display',serif;font-size:17px;font-weight:400;}
.pay-ok{color:var(--sage);}
.pay-fail{color:var(--danger);}
.pay-pend{color:var(--warn);}

/* ── Empty state ── */
.empty-state{
  padding:40px 20px;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:10px;
}
.empty-state svg{opacity:.2;}
.empty-label{font-size:14px;color:var(--muted);}

/* ── Progress ring ── */
.progress-wrap{display:flex;align-items:center;gap:16px;padding:16px 0;}
.ring-svg{flex-shrink:0;}
.ring-info strong{font-size:20px;font-weight:700;color:var(--navy);display:block;}
.ring-info span{font-size:12px;color:var(--muted);}

/* ── Notif dot ── */
.notif-dot{width:8px;height:8px;border-radius:50%;background:var(--danger);border:2px solid var(--surface);}

/* ── Modal overlay ── */
.overlay{position:fixed;inset:0;background:rgba(28,41,64,.5);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:200;animation:fadeIn .2s;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.modal{background:var(--surface);border-radius:18px;border:1px solid var(--border);width:100%;max-width:420px;padding:28px;box-shadow:0 20px 50px rgba(0,0,0,.15);animation:slideUp .22s ease;position:relative;}
.modal-close{position:absolute;top:14px;right:14px;width:28px;height:28px;border-radius:7px;border:1px solid var(--border);background:var(--bg);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);font-size:14px;}
.modal-close:hover{background:var(--border);}
.modal-title{font-family:'DM Serif Display',serif;font-size:20px;color:var(--navy);margin-bottom:6px;}
.modal-sub{font-size:13px;color:var(--muted);margin-bottom:20px;line-height:1.6;}
.modal-icon{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:22px;}
.icon-warn{background:var(--warn-lt);}
.icon-ok{background:var(--sage-lt);}

/* ── Scrollbar ── */
.main::-webkit-scrollbar{width:6px;}
.main::-webkit-scrollbar-track{background:transparent;}
.main::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}

@media(max-width:900px){
  .sidebar{display:none;}
  .grid-4{grid-template-columns:1fr 1fr;}
  .grid-2{grid-template-columns:1fr;}
  .next-hero{flex-direction:column;align-items:flex-start;}
  .hero-actions{width:100%;}
}
</style>
</head>
<body>
<div id="app"></div>

<script type="text/babel">
const { useState } = React;

// ── Mock data ──────────────────────────────────
const PATIENT = { name:'Valentina Rossi', initials:'VR', email:'valentina.rossi@gmail.com', phone:'+54 11 6789-0123', dni:'38.492.101', obra:'OSDE 210', since:'Marzo 2024' };

const UPCOMING = [
  { id:1, day:29, dayName:'Mié', month:'Mayo', time:'10:00 – 10:50', psico:'Dra. Laura Gómez', mode:'online',     paid:true  },
  { id:2, day:5,  dayName:'Mié', month:'Jun',  time:'10:00 – 10:50', psico:'Dra. Laura Gómez', mode:'presencial', paid:false },
  { id:3, day:12, dayName:'Mié', month:'Jun',  time:'10:00 – 10:50', psico:'Dra. Laura Gómez', mode:'online',     paid:false },
];

const HISTORY = [
  { id:1, date:'Mié 22 May 2024', time:'10:00 – 10:50', psico:'Dra. Laura Gómez', mode:'online',     paid:true,  stars:5 },
  { id:2, date:'Mié 15 May 2024', time:'10:00 – 10:50', psico:'Dra. Laura Gómez', mode:'presencial', paid:true,  stars:4 },
  { id:3, date:'Mié 8 May 2024',  time:'10:00 – 10:50', psico:'Dra. Laura Gómez', mode:'online',     paid:true,  stars:5 },
  { id:4, date:'Mié 1 May 2024',  time:'10:00 – 10:50', psico:'Dra. Laura Gómez', mode:'presencial', paid:true,  stars:4 },
  { id:5, date:'Mié 24 Abr 2024', time:'10:00 – 10:50', psico:'Dra. Laura Gómez', mode:'online',     paid:true,  stars:5 },
];

const PAYMENTS = [
  { id:1, desc:'Sesión 22 May 2024', date:'22 May 2024',  amount:'$4.500', status:'paid'   },
  { id:2, desc:'Sesión 15 May 2024', date:'15 May 2024',  amount:'$4.500', status:'paid'   },
  { id:3, desc:'Sesión 29 May 2024', date:'Vence hoy',    amount:'$4.500', status:'pending'},
  { id:4, desc:'Sesión 8 May 2024',  date:'8 May 2024',   amount:'$4.500', status:'paid'   },
  { id:5, desc:'Sesión 1 May 2024',  date:'Cobro fallido',amount:'$4.500', status:'failed' },
];

const NAV = [
  { id:'home',     label:'Inicio',           icon:<IcHome/> },
  { id:'agenda',   label:'Mis turnos',        icon:<IcCalendar/>, badge:3 },
  { id:'history',  label:'Historial',         icon:<IcHistory/> },
  { id:'payments', label:'Pagos',             icon:<IcCard/>, badge:1 },
  { id:'profile',  label:'Mi perfil',         icon:<IcUser/> },
];

// ── Icon components ────────────────────────────
function IcHome(){return(<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 6.5L8 2l6 4.5V13a1 1 0 01-1 1H3a1 1 0 01-1-1V6.5Z" stroke="currentColor" strokeWidth="1.4" strokeLinejoin="round"/><path d="M6 14V9h4v5" stroke="currentColor" strokeWidth="1.4" strokeLinejoin="round"/></svg>);}
function IcCalendar(){return(<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1.5" y="2.5" width="13" height="12" rx="2" stroke="currentColor" strokeWidth="1.4"/><path d="M1.5 6.5h13" stroke="currentColor" strokeWidth="1.4"/><path d="M5 1v2M11 1v2" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/></svg>);}
function IcHistory(){return(<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6" stroke="currentColor" strokeWidth="1.4"/><path d="M8 5v3l2 1.5" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/></svg>);}
function IcCard(){return(<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="3.5" width="14" height="9" rx="2" stroke="currentColor" strokeWidth="1.4"/><path d="M1 7h14" stroke="currentColor" strokeWidth="1.4"/><circle cx="4.5" cy="10" r="1" fill="currentColor"/></svg>);}
function IcUser(){return(<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="6" r="3" stroke="currentColor" strokeWidth="1.4"/><path d="M2 14c0-3.314 2.686-6 6-6s6 2.686 6 6" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/></svg>);}
function IcVideo(){return(<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="1" y="3" width="9" height="8" rx="1.5" stroke="currentColor" strokeWidth="1.3"/><path d="M10 5.5l3-2v7l-3-2V5.5Z" stroke="currentColor" strokeWidth="1.3" strokeLinejoin="round"/></svg>);}
function IcBell(){return(<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 2a5 5 0 00-5 5v2.5L2 11h12l-1-1.5V7a5 5 0 00-5-5Z" stroke="currentColor" strokeWidth="1.4"/><path d="M6.5 11a1.5 1.5 0 003 0" stroke="currentColor" strokeWidth="1.4"/></svg>);}
function IcPlus(){return(<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 2v10M2 7h10" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/></svg>);}

// ── Progress ring ──────────────────────────────
function Ring({value, max, color, size=56}){
  const r = (size-8)/2, circ = 2*Math.PI*r;
  const pct = value/max;
  return(
    <svg className="ring-svg" width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--border)" strokeWidth="5"/>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth="5"
        strokeDasharray={circ} strokeDashoffset={circ*(1-pct)}
        strokeLinecap="round" transform={`rotate(-90 ${size/2} ${size/2})`}/>
    </svg>
  );
}

// ── Cancel modal ───────────────────────────────
function CancelModal({appt, onClose, onConfirm}){
  return(
    <div className="overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        <button className="modal-close" onClick={onClose}>✕</button>
        <div className="modal-icon icon-warn" style={{margin:'0 auto 16px'}}>⚠</div>
        <div className="modal-title" style={{textAlign:'center'}}>Cancelar turno</div>
        <div className="modal-sub" style={{textAlign:'center'}}>

// ── APP ────────────────────────────────────────
function App(){
  const [section, setSection] = useState('home');
  const [upcoming, setUpcoming] = useState(UPCOMING);
  const [cancelTarget, setCancelTarget] = useState(null);
  const [showCancelledModal, setShowCancelledModal] = useState(false);

  const topTitles = {home:'Inicio',agenda:'Mis turnos',history:'Historial',payments:'Pagos',profile:'Mi perfil'};

  function confirmCancel(){
    setUpcoming(u=>u.filter(a=>a.id!==cancelTarget.id));
    setCancelTarget(null);
    setShowCancelledModal(true);
  }

  return(
    <div className="shell">
      {/* Sidebar */}
      <aside className="sidebar">
        <div className="sb-logo">
          <div className="sb-logo-mark"><span/><span/><span/><span/></div>
          <span className="sb-logo-text">PsicoLink</span>
        </div>
        <div className="sb-section">Menú</div>
        <nav className="sb-nav">
          {NAV.map(n=>(
            <button key={n.id} className={`sb-item ${section===n.id?'active':''}`} onClick={()=>setSection(n.id)}>
              {n.icon}
              {n.label}
              {n.badge && <span className="sb-badge">{n.badge}</span>}
            </button>
          ))}
        </nav>
        <div className="sb-bottom">
          <div className="sb-user">
            <div className="sb-avatar">{PATIENT.initials}</div>
            <div>
              <div className="sb-user-name">Valentina R.</div>
              <div className="sb-user-role">Paciente</div>
            </div>
          </div>
        </div>
      </aside>

      {/* Main */}
      <div className="main">
        <div className="topbar">
          <span className="topbar-title">{topTitles[section]}</span>
          <div className="topbar-actions">
            <div style={{position:'relative',display:'flex',alignItems:'center'}}>
              <button className="btn btn-ghost btn-sm" style={{width:36,height:36,padding:0,display:'flex',alignItems:'center',justifyContent:'center'}}>
                <IcBell/>
              </button>
              <div className="notif-dot" style={{position:'absolute',top:4,right:4}}></div>
            </div>
            <a href="Agendar Turno.html">
              <button className="btn btn-primary btn-sm"><IcPlus/> Nuevo turno</button>
            </a>
          </div>
        </div>

        <div className="content">
          {section==='home'     && <HomeSection onNavigate={setSection} upcoming={upcoming} onCancel={setCancelTarget}/>}
          {section==='agenda'   && <AgendaSection upcoming={upcoming} onCancel={setCancelTarget}/>}
          {section==='history'  && <HistorySection/>}
          {section==='payments' && <PaymentsSection/>}
          {section==='profile'  && <ProfileSection/>}
        </div>
      </div>

      {/* Modals */}
      {cancelTarget && !showCancelledModal && (
        <CancelModal appt={cancelTarget} onClose={()=>setCancelTarget(null)} onConfirm={confirmCancel}/>
      )}
      {showCancelledModal && (
        <CancelledModal onClose={()=>setShowCancelledModal(false)}/>
      )}
    </div>
  );
}

const rootEl = document.createElement('div');
document.body.appendChild(rootEl);
ReactDOM.createRoot(rootEl).render(<App/>);
</script>
</body>
